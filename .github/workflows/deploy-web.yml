# Web版（https://tsuzuri-quest-v2.web.app）と Light版（/light/）を自動で更新する。
# 開発ブランチに push されたとき、または GitHub の Actions 画面から手動で実行したときに動く。
# 秘密鍵 FIREBASE_SERVICE_ACCOUNT_TSUZURI_QUEST_V2 が未登録なら、何もせずに終わる。
name: Web版を公開

on:
  push:
    branches: [claude/gallant-tesla-kvdjs2]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TSUZURI_QUEST_V2 != '' }}
    steps:
      - name: 秘密鍵の確認
        if: env.HAS_KEY != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_TSUZURI_QUEST_V2 が未登録のため公開をスキップしました"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: subosito/flutter-action@v2
        if: env.HAS_KEY == 'true'
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Web版をビルド
        if: env.HAS_KEY == 'true'
        working-directory: rpg_game_app
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none
      # つづりクエストLight は同じサイトの /light/ に置く（同じ保存場所・同じログインを使う）
      - name: Light版をビルド
        if: env.HAS_KEY == 'true'
        working-directory: tsuzuri_light
        run: |
          flutter pub get
          # WebAssembly 版（対応していないブラウザでは自動で JS 版を使う）。軽く、メモリも少ない
          flutter build web --wasm --release --pwa-strategy=none --dart-define=TSUZURI_LIGHT=true --base-href /light/
          rm -rf ../rpg_game_app/build/web/light
          cp -r build/web ../rpg_game_app/build/web/light
      # Firestore のルール（同期を許可する場所）も反映する。公開用の鍵に権限がなければ失敗するが、
      # Web の公開は続ける（そのときは PC で firebase deploy --only firestore:rules を行う）
      - name: Firestore のルールを反映
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        working-directory: rpg_game_app
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TSUZURI_QUEST_V2 }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only firestore:rules --project tsuzuri-quest-v2 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TSUZURI_QUEST_V2 }}
          projectId: tsuzuri-quest-v2
          channelId: live
          entryPoint: rpg_game_app
