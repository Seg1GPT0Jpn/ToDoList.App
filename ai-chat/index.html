<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyAI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>MyAI チャット</title>
<style>
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #24243e;
    --fg: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #7c6cff;
    --accent2: #5a4bd8;
    --user: #3a3470;
    --danger: #ff6b81;
    --border: #2e2e4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top)); background: var(--bg2);
    border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: var(--fg); background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:active { background: var(--accent2); }
  button.icon { padding: 6px 10px; }

  #status { font-size: 12px; color: var(--muted); padding: 6px 12px; background: var(--bg2);
    border-bottom: 1px solid var(--border); }
  #progress { height: 3px; background: var(--accent); width: 0; transition: width .2s; }

  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bg3); border-bottom-left-radius: 4px; }
  .msg pre { background: #0a0a14; padding: 8px; border-radius: 6px; overflow-x: auto; white-space: pre; font-size: 13px; }
  .msg code { font-family: ui-monospace, Menlo, monospace; }
  .msg .think { color: var(--muted); font-size: 12px; border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 6px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }

  form#composer { display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--bg2); border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg3);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 140px; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* drawer */
  #drawer { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10; }
  #drawer.open { display: block; }
  #panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(340px, 90vw); background: var(--bg2);
    padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px; }
  #panel h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  #panel label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  #panel input, #panel select, #panel textarea { width: 100%; font-size: 14px; color: var(--fg); background: var(--bg3);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  #panel textarea { min-height: 110px; resize: vertical; max-height: none; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #convList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #convList li { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #convList li.active { background: var(--bg3); }
  #convList li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #convList li button { padding: 2px 8px; font-size: 12px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<header>
  <button class="icon" id="menuBtn" aria-label="メニュー">☰</button>
  <h1 id="title">MyAI</h1>
  <button class="icon" id="newBtn" aria-label="新しい会話">＋</button>
</header>
<div id="progress"></div>
<div id="status">準備中…</div>

<main id="messages"></main>

<form id="composer">
  <textarea id="input" rows="1" placeholder="メッセージを入力…" enterkeyhint="send"></textarea>
  <button type="submit" class="primary" id="sendBtn" disabled>送信</button>
</form>

<div id="drawer">
  <div id="panel">
    <section>
      <h2>会話</h2>
      <ul id="convList"></ul>
    </section>

    <section>
      <h2>AIモデル</h2>
      <label for="modelSelect">使用するモデル（初回はダウンロードが必要）</label>
      <select id="modelSelect"></select>
      <div class="row" style="margin-top:8px">
        <button type="button" id="loadBtn" class="primary">読み込む</button>
      </div>
      <p class="note">モデルはこの端末内で動作します。サーバーに会話は送信されません。一度ダウンロードすると端末に保存され、次回以降はオフラインでも使えます。</p>
    </section>

    <section>
      <h2>AIのキャラクター設定</h2>
      <label for="aiName">AIの名前</label>
      <input id="aiName" maxlength="30">
      <label for="systemPrompt" style="margin-top:8px">性格・役割・ルール（システムプロンプト）</label>
      <textarea id="systemPrompt"></textarea>
      <div class="row" style="margin-top:8px">
        <div>
          <label for="temperature">創造性 <span id="tempVal"></span></label>
          <input id="temperature" type="range" min="0" max="1.5" step="0.1">
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" id="saveSettings" class="primary">設定を保存</button>
        <button type="button" id="resetSettings">初期値に戻す</button>
      </div>
    </section>

    <section>
      <h2>データ</h2>
      <div class="row">
        <button type="button" id="exportBtn">会話を書き出し</button>
        <button type="button" id="clearBtn">全削除</button>
      </div>
    </section>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
